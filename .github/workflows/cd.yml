name: CD - Deploy to Production

on:
  workflow_run:
    workflows: ["CI - Test & Lint"] # Pastikan nama ini sama persis dengan nama di dalam ci.yml
    types:
      - completed
    branches:
      - main

jobs:
  deploy:
    name: Deploy Application
    runs-on: self-hosted
    if: ${{ github.event.workflow_run.conclusion == 'success' }} # Pastikan deploy jalan HANYA JIKA test sukses
    # HAPUS BARIS "needs: test" KARENA SUDAH TIDAK DIPAKAI LAGI
    
    steps:
      - name: Checkout Repository
# ... (lanjutkan step deploy kamu ke bawah)
