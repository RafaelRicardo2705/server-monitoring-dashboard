name: CD - Deploy to Production

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  deploy:
    name: Deploy with PM2
    runs-on: self-hosted
    
    
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
      
      - name: Setup and Deploy
        run: |
          echo "🚀 Deploying..."
          pwd
          ls -la
          npm ci --production
          pm2 restart dashboard || pm2 start src/server.js --name dashboard
          pm2 save
          echo "✅ Done!"
