# ============================================================================
# CD WORKFLOW - Continuous Deployment
# ============================================================================

name: CD - Deploy to Production

on:
  # Trigger otomatis saat workflow "CI - Test & Lint" selesai dijalankan di branch main
  workflow_run:
    workflows: ["CI - Test & Lint"]
    types:
      - completed
    branches:
      - main
  # Tetap izinkan trigger manual jika dibutuhkan
  workflow_dispatch:

jobs:
  deploy:
    name: Deploy with PM2
    runs-on: self-hosted
    
    # Kunci Keamanan: Pastikan deploy HANYA jalan jika CI berstatus 'success'
    # Atau jika dijalankan secara manual (workflow_dispatch)
    if: ${{ github.event.workflow_run.conclusion == 'success' || github.event_name == 'workflow_dispatch' }}
    
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
      
      - name: Deploy Application
        run: |
          echo "🚀 Starting deployment..."
          cd /var/www/server-monitoring-dashboard || cd $GITHUB_WORKSPACE
          git pull origin main
          npm ci --production
          pm2 restart dashboard || pm2 start src/server.js --name dashboard
          pm2 save
          echo "✅ Deployment successful!"
          pm2 status
      
      - name: Health Check
        run: |
          echo "🏥 Health check..."
          sleep 2
          curl -f http://localhost:3000/api/status || (echo "❌ Failed!" && exit 1)
          echo "✅ Health check passed!"
