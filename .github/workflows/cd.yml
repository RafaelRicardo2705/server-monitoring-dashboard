name: CD - Deploy to Production

on:
  # Memantau workflow CI, jalan otomatis kalau CI selesai dan sukses di branch main
  workflow_run:
    workflows: ["CI - Test & Lint"] # Pastikan nama ini sama persis dengan "name:" di file ci.yml kamu
    types:
      - completed
    branches:
      - main
  workflow_dispatch:

jobs:
  deploy:
    name: Deploy with PM2
    runs-on: self-hosted
    
    # Kunci Keamanan: Pastikan CI berstatus 'success' sebelum lanjut deploy
    if: ${{ github.event.workflow_run.conclusion == 'success' || github.event_name == 'workflow_dispatch' }}
    
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
      
      - name: Setup and Deploy
        run: |
          echo "🚀 Deploying..."
          pwd
          ls -la
          npm ci --production
          pm2 restart dashboard || pm2 start src/server.js --name dashboard
          pm2 save
          echo "✅ Done!"
